services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gelyx-labs
      POSTGRES_USER: gelyx-labs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      PORT: ${PORT:-8080}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=gelyx-labs;Username=gelyx-labs;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__Issuer: ${JWT_ISSUER:-GelyxLabs}
      Jwt__Audience: ${JWT_AUDIENCE:-GelyxLabs}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      MIGRATE_ON_STARTUP: "true"
      Auth__AllowSelfRegistration: ${AUTH_ALLOW_SELF_REGISTRATION:-true}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

volumes:
  postgres_data:
